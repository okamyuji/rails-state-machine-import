name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # scan_ruby(brakeman+bundler-audit)・lint(rubocop)・test・system-test を
  # 中央リポジトリのreusableワークフローへ集約。
  # test-commandは旧test＋system-testの流れ（db:test:prepare→全rspec）を統合したもの。
  # 失敗時のtmp/screenshotsアップロードはreusable側のtestジョブに内蔵されている。
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@v1
    with:
      with-mysql: false
      test-command: "bin/rails db:test:prepare && bundle exec rspec"

  # Gemfile.lockの自己整合性検証。dependabotのgem更新がCHECKSUMSセクションを
  # 更新し忘れると、frozenモードのbundle installがexit 16で全ジョブを巻き込んで
  # 落ちる（2026-07-12のsorbet-static不整合で実証）。bundler-cacheを使わず
  # bundle lockで再生成し、差分が出たら明示的なエラーで早期検出する。
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Verify Gemfile.lock is self-consistent
        run: |
          # .bundle/configのfrozen=trueは環境変数より優先されるためlocal configで解除する
          bundle config set --local frozen false
          bundle lock
          git diff --exit-code Gemfile.lock || {
            echo "::error file=Gemfile.lock::Gemfile.lock is inconsistent (stale CHECKSUMS or resolution drift). Run 'bundle config set --local frozen false && bundle lock' locally and commit the result."
            exit 1
          }

  # importmap auditはreusable側に対応が無いためリポジトリ固有ジョブとして残す。
  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  # gitleaksによる秘密情報スキャン（新規追加）。
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
